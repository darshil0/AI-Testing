[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-framework"
version = "2.1.5"
description = "A professional, enterprise-ready evaluation framework for benchmarking AI models."
authors = [{ name = "Darshil", email = "darshil@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["AI", "evaluation", "benchmarking", "LLM", "NLP"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "openai>=2.45.0",
    "anthropic>=0.116.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.6.0",
    "requests>=2.34.0",
    "python-dotenv>=1.2.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "datasets>=5.0.0",
    "rich>=15.0.0",
    "streamlit>=1.59.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tenacity>=9.1.0",
    "python-dateutil>=2.9.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-mock>=3.15.0",
    "flake8>=7.3.0",
    "black>=26.5.0",
    "isort>=8.0.0",
]

[project.scripts]
run-evaluation = "ai_evaluation.run_evaluation:main"
view-dashboard = "ai_evaluation.dashboard:main"

[project.urls]
Homepage = "https://github.com/darshil0/AI-Testing"
Issues = "https://github.com/darshil0/AI-Testing/issues"
Repository = "https://github.com/darshil0/AI-Testing.git"

[tool.setuptools]
packages = ["ai_evaluation"]

[tool.black]
line-length = 88
target-version = ['py39']
