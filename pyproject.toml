[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-framework"
version = "2.1.8"
description = "A professional, enterprise-ready evaluation framework for benchmarking AI models."
authors = [{ name = "Darshil", email = "darshil@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["AI", "evaluation", "benchmarking", "LLM", "NLP"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "requests>=2.34.0",
    "python-dotenv>=1.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "python-dateutil>=2.8.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
gemini = ["google-genai>=0.1.0"]
ollama = ["ollama>=0.1.0"]
dashboard = [
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]
hf = ["datasets>=2.14.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
    "ollama>=0.1.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
run-evaluation = "ai_evaluation.run_evaluation:main"
view-dashboard = "ai_evaluation.dashboard:main"
generate-analytics = "ai_evaluation.analytics:generate_analytics"

[project.urls]
Homepage = "https://github.com/darshil0/AI-Testing"
Issues = "https://github.com/darshil0/AI-Testing/issues"
Repository = "https://github.com/darshil0/AI-Testing.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_evaluation*"]

[tool.setuptools.package-data]
ai_evaluation = ["config.yaml", "test_cases/*"]

[tool.black]
line-length = 88
target-version = ['py39']
