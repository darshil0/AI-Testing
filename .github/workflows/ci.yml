name: AI-Testing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  # Add checks: write if you later publish test results as checks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: |
          pytest --maxfail=2 --disable-warnings

      - name: Run Flake8 (Linting)
        continue-on-error: true
        run: |
          flake8 .

      - name: Ensure results directory exists
        run: |
          mkdir -p ai_evaluation/results

      - name: Run Simulated Evaluation
        continue-on-error: true
        timeout-minutes: 30
        run: |
          run-evaluation --models simulated:default

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: ai_evaluation/results/
          if-no-files-found: warn
