name: AI-Testing CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package import
        run: |
          python -c "import ai_evaluation; print('ai_evaluation import successful')"

      - name: Check Black formatting
        run: |
          python -m black --check .

      - name: Check import ordering
        run: |
          python -m isort --check-only .

      - name: Run Flake8 linting
        run: |
          python -m flake8 .

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --maxfail=2 \
            --disable-warnings \
            --cov=ai_evaluation \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75

      - name: Create evaluation results directory
        run: |
          mkdir -p ai_evaluation/results

      - name: Run simulated evaluation
        timeout-minutes: 10
        run: |
          run-evaluation --models simulated:default

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-py${{ matrix.python-version }}
          path: ai_evaluation/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
