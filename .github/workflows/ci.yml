name: AI-Testing CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only. Never cancel a run on main, so every
# commit on main keeps its own pass/fail signal.
concurrency:
  group: ai-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint · Black, isort, Flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Black formatting
        run: python -m black --check --diff .

      - name: Check import ordering
        run: python -m isort --profile black --check-only --diff .

      - name: Run Flake8 linting
        run: python -m flake8 .

  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Verify package import
        run: |
          python -c "import ai_evaluation; print('ai_evaluation import successful')"

      - name: Create evaluation results directory
        run: mkdir -p ai_evaluation/results

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --maxfail=2 \
            --cov=ai_evaluation \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75

      - name: Run simulated evaluation
        timeout-minutes: 10
        run: |
          command -v run-evaluation >/dev/null \
            || { echo "::error::run-evaluation entry point not installed"; exit 1; }
          run-evaluation --models simulated:default --allow-failures

      - name: Upload evaluation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-py${{ matrix.python-version }}
          path: ai_evaluation/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
